name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC daily — catches newly-disclosed CVEs on deps you already use
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14   # pinned = same package manager that enforces trustedDependencies locally

      - name: Install dependencies
        run: bun install --frozen-lockfile   # fails if bun.lock doesn't match package.json

      - name: Audit production dependencies
        # Threshold is `critical`, not `high`, because of ONE residual high with no
        # available fix: lodash (GHSA-r5fr-rjxr-66jc, via recharts). lodash's latest
        # published version (4.17.21) is itself inside the advisory's vulnerable
        # range — no patched version exists on npm. The real fix is recharts 3.x,
        # which dropped the lodash dependency, but that's a major breaking bump for
        # the chart components and is tracked separately.
        #
        # Practical exploitability here is near-zero: recharts uses lodash for
        # internal utilities, NOT `_.template` with attacker-controlled input
        # (the vector the advisory describes). So we block on criticals (RCEs,
        # auth bypasses) and keep the 1 high visible-but-non-blocking in every
        # nightly log. When recharts is bumped to 3.x (or lodash publishes a
        # patch), raise this back to `--audit-level=high`.
        run: bun audit --production --audit-level=critical

      - name: Report untrusted lifecycle scripts
        run: bun pm untrusted   # prints which postinstall scripts are blocked — visibility only
        continue-on-error: true # never fails the workflow
