# ─── Dependabot — advisory alerts + auto-PRs for security updates ────────────
#
# Why: `bun audit` (in security-audit.yml) catches KNOWN-compromised packages
# at CI time. Dependabot complements it by (a) alerting on new advisories as
# they're disclosed (GitHub Advisory Database), and (b) auto-opening PRs to
# bump patched versions — so you don't have to notice + act manually.
#
# Combined posture:
#   - trustedDependencies: []        → blocks malicious postinstall at install
#   - bun.lock + frozen-lockfile CI  → prevents silent version resolution
#   - bun audit (nightly)            → catches known-compromised versions
#   - Dependabot                      → alerts + auto-fixes on new advisories

version: 2
updates:
  # Production dependencies — weekly, security-only (grouped to avoid PR spam)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Europe/Prague'
    open-pull-requests-limit: 5
    # Security-only — we don't want Dependabot churning feature updates;
    # those we'll handle manually. Security updates are auto-PR'd.
    allow:
      - dependency-type: 'direct'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    # Group security updates into one PR (less noise)
    groups:
      security-updates:
        update-types:
          - 'security'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    labels:
      - 'dependencies'
      - 'security'

  # Dev dependencies — less urgent, monthly
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    allow:
      - dependency-type: 'development'
    commit-message:
      prefix: 'chore(dev-deps)'
    labels:
      - 'dependencies'

  # GitHub Actions versions — keep the workflow actions (actions/checkout, etc.) current
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'
      - 'ci'
